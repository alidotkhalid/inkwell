name: Release

# Push a tag such as v1.3.0 to build the installer on Windows and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/release/Inkwell Setup.exe
            dist/Inkwell.html
