<body class="nodoc" data-tool="select">

<header id="topbar">
  <button class="ib" id="btnSidebar" title="Show or hide the pages panel">{{i:panel-left}}</button>
  <div id="docTitle" title=""><span id="docName">Inkwell</span><span id="dirtyDot" hidden title="Unsaved changes"></span></div>

  <div class="grp">
    <button class="ib lbl" id="btnOpen" title="Open a PDF (Ctrl+O)">{{i:folder-open}}<span>Open</span></button>
    <button class="ib lbl" id="btnSave" title="Save (Ctrl+S)" disabled>{{i:save}}<span>Save</span></button>
    <button class="ib" id="btnSaveAs" title="Save as a new file (Ctrl+Shift+S)" disabled>{{i:save-all}}</button>
    <button class="ib" id="btnPrint" title="Print (Ctrl+P)" disabled>{{i:printer}}</button>
  </div>

  <div class="grp">
    <button class="ib" id="btnUndo" title="Undo (Ctrl+Z)" disabled>{{i:undo-2}}</button>
    <button class="ib" id="btnRedo" title="Redo (Ctrl+Y)" disabled>{{i:redo-2}}</button>
  </div>

  <div class="spacer"></div>

  <div class="grp" id="pageNav">
    <button class="ib" id="btnPrev" title="Previous page" disabled>{{i:chevron-up}}</button>
    <button class="ib" id="btnNext" title="Next page" disabled>{{i:chevron-down}}</button>
    <input id="pageInput" type="text" inputmode="numeric" value="" aria-label="Page number" disabled>
    <span id="pageCount"></span>
  </div>

  <div class="grp">
    <button class="ib" id="btnZoomOut" title="Zoom out (Ctrl+−)" disabled>{{i:zoom-out}}</button>
    <select id="zoomSel" title="Zoom" disabled>
      <option value="auto">Automatic</option>
      <option value="width">Fit width</option>
      <option value="page">Fit page</option>
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
      <option value="3">300%</option>
      <option value="4">400%</option>
      <option value="custom" hidden></option>
    </select>
    <button class="ib" id="btnZoomIn" title="Zoom in (Ctrl++)" disabled>{{i:zoom-in}}</button>
  </div>

  <div class="grp">
    <button class="ib" id="btnFind" title="Find in document (Ctrl+F)" disabled>{{i:search}}</button>
    <button class="ib" id="btnTheme" title="Switch between light and dark">{{i:moon}}</button>
  </div>
</header>

<div id="main">
  <nav id="rail" aria-label="Tools">
    <button class="tb on" data-tool="select" title="Select and move (V)">{{i:mouse-pointer-2}}</button>
    <button class="tb" data-tool="hand" title="Pan around the page (H)">{{i:hand}}</button>
    <hr>
    <button class="tb" data-tool="text" title="Add text (T)">{{i:type}}</button>
    <button class="tb" data-tool="edittext" title="Edit existing text (E)">{{i:text-cursor-input}}</button>
    <hr>
    <button class="tb" data-tool="hl" title="Highlight, underline, strike through (U)">{{i:highlighter}}</button>
    <button class="tb" data-tool="draw" title="Draw freehand (D)">{{i:pen}}</button>
    <button class="tb" data-tool="shape" title="Shapes, lines and arrows (R)">{{i:square}}</button>
    <button class="tb" data-tool="whiteout" title="White out an area (W)">{{i:eraser}}</button>
    <hr>
    <button class="tb" data-tool="image" title="Place an image (I)">{{i:image}}</button>
    <button class="tb" data-tool="sign" title="Sign (S)">{{i:signature}}</button>
    <button class="tb" data-tool="check" title="Tick or cross (C)">{{i:check}}</button>
  </nav>

  <aside id="sidebar">
    <div id="sideTabs" role="tablist">
      <button class="on" data-tab="thumbs" role="tab">Pages</button>
      <button data-tab="outline" role="tab">Contents</button>
    </div>
    <div id="pageTools">
      <button class="ib" id="btnAddPdf" title="Add pages from another PDF or image">{{i:file-plus-2}}</button>
      <button class="ib" id="btnBlank" title="Add a blank page">{{i:plus}}</button>
      <button class="ib" id="btnRotL" title="Rotate left">{{i:rotate-ccw}}</button>
      <button class="ib" id="btnRotR" title="Rotate right">{{i:rotate-cw}}</button>
      <button class="ib" id="btnDup" title="Duplicate page">{{i:copy-plus}}</button>
      <button class="ib" id="btnExtract" title="Save selected pages as a new PDF">{{i:file-output}}</button>
      <button class="ib danger" id="btnDelPage" title="Delete selected pages">{{i:trash-2}}</button>
    </div>
    <div id="thumbs" tabindex="0" aria-label="Page thumbnails"></div>
    <div id="outline" hidden></div>
  </aside>

  <section id="desk">

        <h1>Open a PDF</h1>
        <p>Drop a file anywhere in this window, or choose one from your computer. Nothing is uploaded: the file stays on this laptop.</p>
        <button class="primary" id="btnOpenBig">{{i:folder-open}}<span>Choose a PDF</span></button>
        <div id="recent" hidden>
          <h2>Recent</h2>
          <ul id="recentList"></ul>
        </div>
      </div>
    </div>
    <div id="dropHint" hidden><div>Drop to open</div></div>
    <div id="selPop" hidden>
      <button data-act="highlight" title="Highlight">{{i:highlighter}}</button>
      <button data-act="underline" title="Underline">{{i:underline}}</button>
      <button data-act="strike" title="Strike through">{{i:strikethrough}}</button>
      <button data-act="copy" title="Copy">{{i:copy}}</button>
    </div>
  </section>
</div>

<div id="toast" role="status" aria-live="polite" popover="manual"></div>
<div id="busy" hidden><div class="spin"></div><span id="busyText">Working</span></div>

<dialog id="dlgSign">
  <form method="dialog">
    <h2>Your signature</h2>
    <div class="seg" id="signMode">
      <button type="button" class="on" data-mode="draw">Draw</button>
      <button type="button" data-mode="type">Type</button>
    </div>
    <div id="signDrawWrap"><canvas id="signPad" width="920" height="300"></canvas><div class="signLine"></div></div>
    <div id="signTypeWrap" hidden><input id="signText" type="text" placeholder="Type your name" autocomplete="off"></div>
    <div id="signSaved" hidden><span>Saved</span><div id="signSavedList"></div><button type="button" id="signForget" title="Remove the saved signatures from this computer">Forget</button></div>
    <label class="chk"><input type="checkbox" id="signRemember"> Remember this signature on this computer</label>
    <div class="dlgBtns">
      <button type="button" id="signClear">Clear</button>
      <span class="spacer"></span>
      <button type="button" id="signCancel">Cancel</button>
      <button type="button" class="primary" id="signUse">Place signature</button>
    </div>
  </form>
</dialog>

<dialog id="dlgPrint">
  <div id="prWrap">
    <aside id="prOpts">
      <h2>Print</h2>
      <label for="prPrinter">Printer</label>
      <select id="prPrinter"></select>
      <div class="prRow">
        <div><label for="prCopies">Copies</label><input id="prCopies" type="number" min="1" max="99" value="1"></div>
        <div><label for="prColor">Colour</label><select id="prColor"><option value="color">Colour</option><option value="mono">Black and white</option></select></div>
      </div>
      <label for="prPages">Pages</label>
      <select id="prPages"><option value="all">All pages</option><option value="current">The page I am on</option><option value="custom">Choose pages</option></select>
      <input id="prRange" type="text" placeholder="For example 1-3, 5" aria-label="Pages to print" autocomplete="off" hidden>
      <div class="prRow">
        <div><label for="prPaper">Paper</label><select id="prPaper"><option>A4</option><option>Letter</option><option>Legal</option><option>A3</option><option>A5</option></select></div>
        <div><label for="prOrient">Orientation</label><select id="prOrient"><option value="auto">Automatic</option><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div>
      </div>
      <label for="prScale">Size on paper</label>
      <select id="prScale"><option value="fit">Fit to the paper</option><option value="actual">Actual size</option></select>
      <label for="prDuplex">Two-sided</label>
      <select id="prDuplex"><option value="simplex">Off</option><option value="longEdge">On, flip on the long edge</option><option value="shortEdge">On, flip on the short edge</option></select>
      <p id="prInfo"></p>
      <button type="button" id="prSystem" title="Open the Windows print window for paper tray, quality and other printer settings">More printer settings</button>
      <div class="dlgBtns">
        <span class="spacer"></span>
        <button type="button" id="prCancel">Cancel</button>
        <button type="button" class="primary" id="prGo">Print</button>
      </div>
    </aside>
    <section id="prPreview" aria-label="Print preview"></section>
  </div>
</dialog>

<dialog id="dlgAsk">
  <form method="dialog">
    <h2 id="askTitle"></h2>
    <p id="askText"></p>
    <input id="askInput" type="password" hidden autocomplete="off">
    <div class="dlgBtns"><span class="spacer"></span><div id="askBtns"></div></div>
  </form>
</dialog>

<input type="file" id="fileOpen" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileAdd" accept="application/pdf,.pdf,image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml,.png,.jpg,.jpeg,.webp,.gif,.bmp,.svg" multiple hidden>
<input type="file" id="fileImg" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml,.png,.jpg,.jpeg,.webp,.gif,.bmp,.svg" hidden>
<div id="printArea"></div>

<!--ASSETS-->
<script type="module">
/*JS*/
</script>
</body>
</html>
